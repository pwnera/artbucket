# Postgres and S3-compatible storage, for development: `docker compose up -d`.
#
# The whole thing, app included, with no Node on the machine:
#   cp .env.example .env    # set BETTER_AUTH_SECRET
#   docker compose --profile app up -d
#
# Production self-hosters can point S3_* at real S3, Cloudflare R2, Backblaze
# B2, Garage, or MinIO - anything S3-compatible - and drop the s3 service.
#
# Postgres and storage listen on this machine only (127.0.0.1): reach storage
# from outside through a reverse proxy. Their passwords come from .env
# (POSTGRES_PASSWORD, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY); the defaults
# are for development, so set your own on a server.
services:
  app:
    profiles: ["app"]
    image: ghcr.io/pwnera/artbucket:${ARTBUCKET_VERSION:-latest}
    build: .
    ports: ["${APP_PORT:-3000}:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://artbucket:${POSTGRES_PASSWORD:-artbucket}@postgres:5432/artbucket
      # The app reaches storage inside this network; browsers upload to the published port.
      S3_ENDPOINT: http://s3:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: artbucket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artbucket}
      POSTGRES_DB: artbucket
    ports: ["127.0.0.1:5433:5432"]
    volumes: [".pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artbucket"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SeaweedFS rather than MinIO: Apache-2.0, and its images are not gated
  # behind a registry login.
  s3:
    image: chrislusf/seaweedfs:latest
    # The one identity, with the app's keys from .env.
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-artbucket}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-artbucket}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"artbucket","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec /entrypoint.sh server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    ports: ["127.0.0.1:9000:9000"]
    volumes: [".s3-data:/data"]
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to ::1 first and SeaweedFS
      # binds IPv4 only, so the probe fails while the service is perfectly fine.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
