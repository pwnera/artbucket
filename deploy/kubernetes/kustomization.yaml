# Artbucket on Kubernetes: `kubectl apply -k deploy/kubernetes` (docs/installation/kubernetes.mdx).
# To try it first with nothing to set up, see quickstart/.
#
# Bring Postgres 16+ and S3-compatible storage (managed, or in the cluster with
# an operator). Before applying:
#   cp secret.env.example secret.env    # fill it in; git ignores it
#   edit config.env and gateway.yaml    # your domain and storage
#
# Both files become a ConfigMap and a Secret whose names carry a hash of their
# contents, so changing either rolls the pods.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: artbucket
labels:
  - pairs:
      app.kubernetes.io/name: artbucket
    includeSelectors: true
resources:
  - app
  - gateway.yaml
configMapGenerator:
  - name: artbucket-config
    envs: [config.env]
secretGenerator:
  - name: artbucket-secret
    envs: [secret.env]
images:
  # Pin a version here: `newTag: "1.0.0"` or `"1.0"`.
  - name: ghcr.io/pwnera/artbucket
    newTag: "1"
