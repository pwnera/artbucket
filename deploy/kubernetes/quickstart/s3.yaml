# SeaweedFS as S3-compatible storage, as in docker-compose.yml. The app makes
# its bucket and the bucket's CORS rules when it starts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: s3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: s3
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          # The one identity, with the app's keys.
          env:
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: artbucket-secret, key: S3_ACCESS_KEY_ID }
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: artbucket-secret, key: S3_SECRET_ACCESS_KEY }
          command: ["/bin/sh", "-c"]
          args:
            - >
              printf '{"identities":[{"name":"artbucket","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
              "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
              exec /entrypoint.sh server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: s3
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector:
    app.kubernetes.io/component: s3
  ports:
    - name: s3
      port: 9000
      targetPort: s3
