# What every setup shares: the namespace, the Deployment, its Service, and the
# Gateway in front of it. The setups beside it (.. and ../quickstart) add the
# settings; the quickstart leaves the Gateway out.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - gateway.yaml
