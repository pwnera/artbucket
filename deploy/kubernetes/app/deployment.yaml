apiVersion: apps/v1
kind: Deployment
metadata:
  name: artbucket
spec:
  # One replica: the rate limit counts per pod. More work (migrations run under
  # a lock, the sweeper is safe twice), each allowing RATE_LIMIT on its own.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
    spec:
      securityContext:
        # The image's `node` user.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: artbucket
          image: ghcr.io/pwnera/artbucket
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: artbucket-config
            - secretRef:
                name: artbucket-secret
          # A static file: no database query per probe. The server answers
          # nothing before its migrations have run, so an answer means they did.
          startupProbe:
            httpGet: { path: /icon.svg, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /icon.svg, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /icon.svg, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            # Uploads are buffered (up to 512 MB) while previews are made.
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
