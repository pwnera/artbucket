title: Color
lede: One accent a week. Ink and paper hold it steady.
sections:
  - template: cover
    eyebrow: 02 / Color
    title: |-
      Ink, paper,
      and one accent a week.
    lede: Most of every page is Paper and Ink. The accent marks what matters, and it changes every Monday.
    props:
      mark: never
      strip: true
      titleSize: huge
  - template: palette
    title: Start with this week's accent.
    lede: A fill, never text. Copy the values. Check the pairing.
    keys: [color.primary, color.onPrimary]
    props:
      ase: true
      show: [hex, rgb, hsl, css]
      simulate: true
    columns: 2
  - id: rotation
    template: palette
    title: Six accents, one a week.
    lede: Volt, Iris, Signal, Tide, Moss, Fuchsia, then again. Every Monday the release changes the accent, and every site follows.
    keys: [color.volt, color.iris, color.signal, color.tide, color.moss, color.fuchsia]
    props:
      show: [hex]
    columns: 3
  - id: rest
    template: statement
    title: The empty space is part of the palette.
    body: Use the proportions as a starting point for a composition, not a quota for every screen.
    tone: dark
    width: full
  - id: neutrals
    template: palette
    title: Give the work a ground.
    keys:
      - color.background
      - color.panel
      - color.ink
      - color.muted
      - color.dark
      - color.border
    props:
      show: [hex, css]
  - id: contrast
    template: palette
    title: Which text goes on which color.
    lede: Compare text and background pairs before you use them.
    keys:
      - color.primary
      - color.onPrimary
      - color.ink
      - color.muted
      - color.background
    props:
      show: [hex]
      matrix: true
      simulate: true
  - id: contexts
    template: palette
    title: The same intent, after dark.
    body: Ink and Muted get lighter on dark backgrounds. Choose the context to see the value change.
    keys: [color.ink, color.muted]
    props:
      show: [hex, css]
    columns: 2
    contexts: [default, dark-background]
  - id: next
    template: pages
    title: Keep exploring.
    items:
      - link: /logo
        text: Three files, and what to leave alone.
        title: 01 / Logo
      - link: /type
        text: Three faces and one scale.
        title: 03 / Type
      - link: /voice
        text: Habits, examples and copy to paste.
        title: 04 / Voice
      - link: /playground
        text: The pattern, spacing, corners, motion and charts, drawn.
        title: 05 / Playground
      - link: /resources
        text: Every file, and a way to ask for more.
        title: 06 / Resources
