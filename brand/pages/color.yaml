title: Color
lede: One accent a week. Ink and paper hold it steady.
sections:
  - template: cover
    eyebrow: 02 / The palette
    title: |-
      A little color.
      A lot of character.
    lede: This week's accent leads. Ink and paper set the pace.
    props:
      mark: never
      strip: true
      titleSize: huge
  - template: palette
    title: Start with this week's accent.
    lede: A fill, never text. Copy the values. Check the pairing.
    keys: [color.primary, color.onPrimary]
    props:
      ase: true
      show: [hex, rgb, hsl, css]
      simulate: true
    columns: 2
  - id: rotation
    template: palette
    title: Six accents, one a week.
    lede: Volt, Iris, Signal, Tide, Moss, Fuchsia, then again. Every Monday the release changes the accent, and every site follows.
    keys: [color.volt, color.iris, color.signal, color.tide, color.moss, color.fuchsia]
    props:
      show: [hex]
    columns: 3
  - id: rest
    template: statement
    title: The empty space is part of the palette.
    body: Use the proportions as a starting point for a composition, not a quota for every screen.
    tone: dark
    width: full
  - id: neutrals
    template: palette
    title: Give the work a ground.
    keys:
      - color.background
      - color.panel
      - color.ink
      - color.muted
      - color.dark
      - color.border
    props:
      show: [hex, css]
  - id: contrast
    template: palette
    title: Looks good. Reads clearly.
    lede: Compare text and background pairs before you use them.
    keys:
      - color.primary
      - color.onPrimary
      - color.ink
      - color.muted
      - color.background
    props:
      show: [hex]
      matrix: true
      simulate: true
  - id: contexts
    template: palette
    title: The same intent, after dark.
    body: Ink and Muted get lighter on dark backgrounds. Choose the context to see the value change.
    keys: [color.ink, color.muted]
    props:
      show: [hex, css]
    columns: 2
    contexts: [default, dark-background]
  - id: next
    template: pages
    title: Keep exploring.
    items:
      - link: /logo
        text: Explore its anatomy. Find the right version. Download the originals.
        title: 01 / The mark
      - link: /color
        text: Copy a color. Compare contrast. Try another view.
        title: 02 / The palette
      - link: /type
        text: Type your own specimen and explore the scale.
        title: 03 / The words
      - link: /voice
        text: See the rewrites. Borrow a line. Make it yours.
        title: 04 / The voice
      - link: /playground
        text: Pattern, spacing and motion. The identity in action.
        title: 05 / The playground
      - link: /resources
        text: Current files, useful links and a way to ask.
        title: 06 / The essentials
