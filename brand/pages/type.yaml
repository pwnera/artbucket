title: Type
lede: Expressive headlines. Quiet reading. Exact code.
sections:
  - template: cover
    eyebrow: 03 / Type
    title: |-
      Make room
      for the words.
    lede: Funnel for people. Geist Mono for the things they paste.
    props:
      mark: never
      strip: false
      titleSize: huge
  - template: type
    title: Go on. Type something.
    lede: Replace the sample with your own words and see how each face handles them.
    keys: [type.heading, type.body, type.code]
    props:
      embed: true
      roles: true
      glyphs: true
      sample: Change your brand once. It's right everywhere.
  - id: pause
    template: statement
    title: |-
      Let the headline speak.
      Let the body explain.
    body: Use contrast in size and weight before you reach for another typeface.
    width: full
    tone: plain
  - id: scale
    template: type
    title: A rhythm you can repeat.
    body: "Set every size from this list: 16px for reading, 20px for the line under a headline, 96px for the hero once a page, 12px for short labels. It is a list, not a ratio. The brand site's own headings step up by 1.333 from 16px (its theme's scale)."
    keys: [type.scale]
  - id: habits
    template: dodont
    title: Make reading the easy part.
    items:
      - text: Funnel Display for headings, Funnel Sans for reading, Geist Mono for code and identifiers.
        title: Give each face a job.
        verdict: do
      - text: Avoid all-caps paragraphs, tight body copy or display-sized labels.
        title: Make every line compete.
        verdict: dont
      - text: Let headlines wrap naturally. Keep the meaning intact.
        title: Check the narrow screen.
        verdict: do
      - text: Shorten the line or give it more room before making text hard to read.
        title: Shrink the message to fit.
        verdict: dont
    props:
      layout: pairs
  - id: next
    template: pages
    title: Keep exploring.
    items:
      - link: /logo
        text: Three files, and what to leave alone.
        title: 01 / Logo
      - link: /color
        text: This week's accent, and the neutrals that hold it.
        title: 02 / Color
      - link: /voice
        text: Habits, examples and copy to paste.
        title: 04 / Voice
      - link: /playground
        text: The pattern, spacing, corners, motion and charts, drawn.
        title: 05 / Playground
      - link: /resources
        text: Every file, and a way to ask for more.
        title: 06 / Resources
