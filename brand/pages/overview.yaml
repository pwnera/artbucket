title: Overview
lede: The Artbucket identity. Our marks, colors, type and words, ready to use.
layout: landing
sections:
  - template: cover
    eyebrow: The Artbucket brand
    title: Where brands live.
    lede: Including ours. The mark, the colors, the type and the words.
    props:
      mark: always
      align: center
      strip: true
      height: screen
      markSize: large
      markFrame: bare
      titleSize: huge
  - template: statement
    eyebrow: One catalog. One answer.
    title: |-
      A little order.
      A lot of possibility.
    body: Assets, guidelines and portals in one catalog. One answer for people and agents.
    props:
      align: center
    tone: plain
    size: huge
  - id: the-mark
    template: annotated
    eyebrow: 01 / Mark · Recognize
    title: Good work starts with a little spill.
    lede: A tipped paint bucket. A paint line. One drop.
    body: |-
      It puts making at the center. Keep its shape, give it room and use the original file.

      [Meet the mark](/logo)
    items:
      - at: [38, 40]
        text: Tipped on purpose. Never right it.
        title: The bucket
      - at: [52, 58]
        text: One wave. Work in progress.
        title: The paint line
      - at: [74, 68]
        text: Just one. Check it at actual size.
        title: The drop
    props:
      image: assets/icon.svg
    tone: panel
    width: full
    size: large
  - id: the-type
    template: statement
    eyebrow: 02 / Type · Set
    title: |-
      Headlines with character.
      Reading without fuss.
    body: |-
      Funnel Display speaks up. Funnel Sans gets read. Geist Mono handles the code.

      [See the type system](/type)
    props:
      align: center
    width: full
    size: huge
  - id: the-palette
    template: palette
    eyebrow: 03 / Color · Choose
    title: Violet leads. Lime marks.
    lede: White gives the work room. Violet draws the eye. A little lime picks out what matters.
    body: |-
      Lime is a highlight. Not a background.

      [Explore the full palette](/color)
    keys:
      - color.primary
      - color.highlight
      - color.background
      - color.panel
      - color.ink
      - color.dark
    props:
      show: [hex]
    columns: 2
    size: large
  - id: the-voice
    template: statement
    eyebrow: 04 / Voice · Write
    title: |-
      Say what it does.
      Then stop.
    body: |-
      Plain, exact and a little dry. Less "seamless". More "here you go".

      [Write like Artbucket](/voice)
    tone: dark
    width: full
    size: huge
  - template: pages
    eyebrow: Six pages. One brand.
    title: |-
      Don't just read it.
      Make something.
    items:
      - link: /logo
        text: Three approved files, and what to leave alone.
        title: Use the mark
      - link: /color
        text: Violet, lime and the neutrals that give them room.
        title: Choose your colors
      - link: /type
        text: Three faces, one measured scale.
        title: Set the words
      - link: /voice
        text: Habits, examples and copy to paste.
        title: Sound like Artbucket
      - link: /playground
        text: Space, corners and motion, drawn.
        title: Try the system
      - link: /resources
        text: Every file, and a way to ask for more.
        title: Get the originals
    size: large
  - id: resources
    template: links
    eyebrow: Made for people. Ready for agents.
    title: Take the brand with you.
    body: Start with the approved logo files. The logo guide covers grounds and placement.
    keys: [logo.primary, logo.mark, logo.markWhite]
    items:
      - link: https://artbucket.io/
        text: See the brand at work.
        label: Visit the website
        title: Artbucket
      - link: https://docs.artbucket.io/
        text: Put the catalog to work.
        label: Read the docs
        title: Documentation
      - link: https://github.com/pwnera/artbucket
        text: The core, in the open.
        label: See the code
        title: Open source
    tone: panel
    columns: 3
    size: large
