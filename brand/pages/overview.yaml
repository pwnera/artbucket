title: Overview
lede: The Artbucket identity. Our marks, colors, type and words, ready to use.
sections:
  - template: cover
    eyebrow: The Artbucket brand
    title: |-
      Change your brand once.
      Including ours.
    lede: The mark, the colors, the type and the words. Use them as they are here, and they stay right when the brand changes.
    props:
      mark: never
      align: start
      titleSize: huge
  - id: chapters
    template: pages
    title: Six chapters. One brand.
    lede: Start with the mark. Everything else follows from it.
    items:
      - link: /logo
        text: Three files, and what to leave alone.
        title: Logo
      - link: /color
        text: This week's accent, and the neutrals that hold it.
        title: Color
      - link: /type
        text: Three faces and one scale.
        title: Type
      - link: /voice
        text: Habits, examples and copy to paste.
        title: Voice
      - link: /playground
        text: The pattern, spacing, corners, motion and charts, drawn.
        title: Playground
      - link: /resources
        text: Every file, and a way to ask for more.
        title: Resources
    size: huge
  - id: this-week
    template: palette
    eyebrow: This week
    title: A new accent every Monday.
    lede: Volt, Iris, Signal, Tide, Moss, Fuchsia, then again. This site, the app, the docs and the portal all follow on their own.
    keys: [color.volt, color.iris, color.signal, color.tide, color.moss, color.fuchsia]
    props:
      show: [hex]
    columns: 3
    tone: dark
    width: full
    size: huge
  - id: resources
    template: links
    eyebrow: Made for people. Ready for agents.
    title: Take the brand with you.
    body: Start with the approved logo files. The logo guide covers grounds and placement.
    keys: [logo.primary, logo.mark, logo.markWhite]
    items:
      - link: https://artbucket.io/
        text: See the brand at work.
        label: Visit the website
        title: Artbucket
      - link: https://docs.artbucket.io/
        text: Put the catalog to work.
        label: Read the docs
        title: Documentation
      - link: https://github.com/pwnera/artbucket
        text: The core, in the open.
        label: See the code
        title: Open source
    columns: 3
    size: huge
