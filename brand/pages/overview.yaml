title: Overview
lede: The Artbucket identity. Our marks, colors, type and words, ready to use.
layout: landing
sections:
  - template: cover
    eyebrow: The Artbucket brand
    title: Artbucket
    lede: All your brand. None of the busywork.
    props:
      mark: always
      align: start
      strip: true
      height: auto
      markSize: large
      markFrame: bare
      titleSize: huge
  - template: statement
    eyebrow: Where brands live
    title: |-
      A little order.
      A lot of possibility.
    body: Assets, guidelines and portals in one catalog. One answer for people and agents.
    tone: plain
    size: huge
  - id: the-mark
    template: split
    eyebrow: 01 / Our signature
    title: Good work starts with a little spill.
    body: |-
      A tipped paint bucket. A paint line. One drop.

      Our mark puts making at the center. Keep its shape, give it room and use the original file.
    aside: "[Meet the mark](/logo)"
    props:
      fit: whole
      flip: true
      image: assets/icon.svg
      ratio: even
    tone: panel
    width: full
    size: large
  - id: the-palette
    template: palette
    eyebrow: 02 / Our colors
    title: Violet leads. Lime marks.
    lede: White gives the work room. Violet draws the eye. A little lime picks out what matters.
    aside: |-
      Lime is a highlight, never a large background.

      [Explore the full palette](/color)
    keys: [color.primary, color.highlight, color.background]
    props:
      show: [hex]
    columns: 1
    size: large
  - id: the-type
    template: quote
    eyebrow: 03 / Our type
    title: Words with character.
    lede: Funnel Display for headlines. Funnel Sans for reading. Geist Mono for code.
    body: Make room for the good work.
    aside: "[See the type system](/type)"
    width: full
    size: large
  - id: the-voice
    template: statement
    eyebrow: 04 / Our voice
    title: |-
      Say what it does.
      Then stop.
    body: |-
      Plain, exact and a little dry. Short sentences. Familiar words. No fanfare.

      [Write like Artbucket](/voice)
    tone: dark
    width: full
    size: huge
  - template: pages
    eyebrow: Make something with it
    title: The right starting point.
    items:
      - link: /logo
        text: Three approved files. When to use each and what to leave alone.
        title: Use the mark
      - link: /color
        text: Violet, lime and the neutrals that give them room.
        title: Choose your colors
      - link: /type
        text: Funnel Display, Funnel Sans and Geist Mono.
        title: Set the words
      - link: /voice
        text: Our voice, writing habits and copy you can use.
        title: Sound like Artbucket
    columns: 2
    size: large
  - id: resources
    template: links
    eyebrow: Ready when you are
    title: Take the brand with you.
    body: Start with the approved logo files. Follow the logo guide for backgrounds and placement.
    keys: [logo.primary, logo.mark, logo.markWhite]
    items:
      - link: https://artbucket.io/
        text: See the identity in use.
        label: Visit the website
        title: Artbucket
      - link: https://docs.artbucket.io/
        text: Put the catalog to work.
        label: Read the docs
        title: Documentation
    tone: panel
    columns: 3
    size: large
