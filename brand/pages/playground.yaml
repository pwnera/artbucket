title: Playground
lede: Try the identity as a system of shapes, space and motion.
sections:
  - template: cover
    eyebrow: 05 / Playground
    title: |-
      The pattern, the spacing
      and how things move.
    lede: The values to build a layout with, drawn at size. Take them from here rather than measuring a page.
    props:
      mark: never
      strip: false
      markFrame: bare
      titleSize: huge
  - template: pattern
    title: One mark. A different rhythm.
    body: A pattern study using the original white mark. Keep the silhouette intact and the ground simple.
    keys: [color.primary, color.dark]
    props:
      asset: assets/mark-white.svg
      scales: [0.5, 1, 2]
    width: full
    columns: 2
  - id: spacing
    template: specimen
    title: Spacing.
    body: Take every gap from this scale. Use the small steps inside a group and the large steps between ideas, so readers see what belongs together.
    keys: [space.scale]
    props:
      kind: spacing
  - id: corners
    template: specimen
    title: Soft edges. Clear boundaries.
    keys: [radius.card, radius.stage]
    props:
      kind: radius
  - id: motion
    template: specimen
    title: A response, not a performance.
    body: Short motion acknowledges an action. Larger moves stay quiet. Reduce motion when the reader asks.
    keys: [motion.feedback, motion.reveal]
    props:
      kind: motion
  - id: shadow
    template: specimen
    title: Give the preview a little lift.
    keys: [shadow.panel]
    props:
      kind: shadow
  - template: chart
    title: Charts.
    body: Sample data, shown as a palette study. Keep labels visible and check neighboring colors for contrast.
    keys: [color.primary, color.ink]
    props:
      kind: bar
  - id: next
    template: pages
    title: Keep exploring.
    items:
      - link: /logo
        text: Three files, and what to leave alone.
        title: 01 / Logo
      - link: /color
        text: This week's accent, and the neutrals that hold it.
        title: 02 / Color
      - link: /type
        text: Three faces and one scale.
        title: 03 / Type
      - link: /voice
        text: Habits, examples and copy to paste.
        title: 04 / Voice
      - link: /resources
        text: Every file, and a way to ask for more.
        title: 06 / Resources
