title: Voice
lede: Plain, exact and a little dry. Now put it into practice.
sections:
  - template: cover
    eyebrow: 04 / Voice
    title: |-
      Less grand.
      More useful.
    lede: Say what the thing does, in the words its reader uses, and stop.
    props:
      mark: never
      strip: false
      titleSize: huge
  - id: text
    template: cards
    title: Five habits.
    keys: [tone.always]
    props:
      layout: steps
  - id: names
    template: text
    title: Our names.
    keys: [brand.naming]
  - id: rewrites
    template: dodont
    title: Same idea. Fewer obstacles.
    lede: A few words can make the next step obvious.
    items:
      - text: The second line finishes the first, with the things the reader will touch.
        title: Every logo in one place. The current version for each site, slide and agent.
        verdict: do
      - text: A second slogan adds nothing the first did not say.
        title: Every logo in one place. Endless possibilities, zero friction.
        verdict: dont
      - text: Name the job.
        title: Find the right asset.
        verdict: do
      - text: Avoid promises the reader has to translate.
        title: Unlock seamless asset discovery.
        verdict: dont
      - text: State what is here and what to do next.
        title: No assets yet. Upload the first one.
        verdict: do
      - text: An empty state needs a next step, not a pep talk.
        title: Your creative journey awaits!
        verdict: dont
      - text: Be specific. Keep blame out of it.
        title: That asset did not upload. Try again.
        verdict: do
      - text: A vague error gives the reader nowhere to go.
        title: Oops! Something went wrong.
        verdict: dont
    props:
      layout: pairs
  - id: line
    template: statement
    title: |-
      A little dry.
      Never unkind.
    body: Be direct with the task and generous with the person doing it.
    width: full
    tone: plain
  - template: copy
    title: Good lines. Ready to borrow.
    keys:
      - brand.headline
      - brand.tagline
      - brand.intro
      - tone.action
      - tone.empty
      - tone.error
    width: wide
  - id: generator
    template: copy
    title: Write a useful handoff.
    lede: Fill in the details. Copy a note that gets to the point.
    props:
      form:
        - name: project
          label: Project name
        - name: link
          label: Asset or portal URL
        - name: detail
          label: What the recipient should know
      template: |-
        The assets for {project} are ready.

        {link}

        {detail}
    width: wide
  - id: next
    template: pages
    title: Keep exploring.
    items:
      - link: /logo
        text: Three files, and what to leave alone.
        title: 01 / Logo
      - link: /color
        text: This week's accent, and the neutrals that hold it.
        title: 02 / Color
      - link: /type
        text: Three faces and one scale.
        title: 03 / Type
      - link: /playground
        text: The pattern, spacing, corners, motion and charts, drawn.
        title: 05 / Playground
      - link: /resources
        text: Every file, and a way to ask for more.
        title: 06 / Resources
