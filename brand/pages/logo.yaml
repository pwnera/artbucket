title: Logo
lede: A small spill. A clear signature.
layout: landing
sections:
  - template: cover
    eyebrow: 01 / The mark
    title: |-
      A small spill.
      A clear signature.
    lede: One bucket. One paint line. One drop. Three ways to show up.
    props:
      mark: never
      strip: false
      titleSize: huge
    tone: dark
  - id: anatomy
    template: annotated
    title: Every part earns its place.
    lede: Explore the shape before you put it to work.
    items:
      - title: The tipped bucket
        text: The angle is part of the mark. Keep it exactly as supplied.
        at: [37, 24]
      - title: The paint line
        text: The curved cutout gives the solid shape its character. Never fill it in.
        at: [44, 55]
      - title: The last drop
        text: Small, but essential. Check that it stays visible at the size you use.
        at: [75, 70]
    props:
      image: 5bda5006-f6b8-4402-a71e-fa67b3241a3a
    tone: panel
  - template: logos
    title: The right mark for the ground.
    lede: Choose a version, inspect its backgrounds, or take the whole kit.
    keys:
      - logo.primary
      - logo.mark
      - logo.markWhite
      - color.primary
      - color.dark
    items:
      - key: color.dark
        asset: assets/mark-black.svg
        verdict: dont
        caption: The black mark disappears on Night. Use white.
      - key: color.primary
        asset: assets/mark-white.svg
        verdict: dont
        caption: White disappears on Volt. Use the week's tile file.
    props:
      ask: false
      kit: true
      size: large
    columns: 3
  - id: clearspace
    template: diagram
    title: Leave a little room.
    body: For these layouts, keep a quarter of the mark's height clear on every side.
    keys: [logo.mark, logo.clearSpace]
    props:
      kind: clearspace
    tone: panel
  - id: small
    template: diagram
    title: Small should still feel like us.
    body: See the standalone mark at actual size. The paint line and drop should remain distinct.
    keys: [logo.mark, logo.minSize]
    props:
      kind: minsize
  - template: dodont
    title: Keep the bucket itself.
    keys: [logo.always, logo.neverDo]
    props:
      layout: pairs
    tone: panel
  - id: next
    template: pages
    title: Keep exploring.
    items:
      - title: 01 / The mark
        text: Explore its anatomy. Find the right version. Download the originals.
        link: /logo
      - title: 02 / The palette
        text: Copy a color. Compare contrast. Try another view.
        link: /color
      - title: 03 / The words
        text: Type your own specimen and explore the scale.
        link: /type
      - title: 04 / The voice
        text: See the rewrites. Borrow a line. Make it yours.
        link: /voice
      - title: 05 / The playground
        text: Pattern, spacing and motion. The identity in action.
        link: /playground
      - title: 06 / The essentials
        text: Current files, useful links and a way to ask.
        link: /resources
