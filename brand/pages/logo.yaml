title: Logo
lede: A small spill. A clear signature.
sections:
  - template: cover
    eyebrow: 01 / Logo
    title: |-
      A small spill.
      A clear signature.
    lede: "Three files: the tile in this week's accent, the mark in black, the mark in white."
    props:
      mark: never
      strip: false
      titleSize: huge
  - id: anatomy
    template: annotated
    title: The three parts of the mark.
    lede: Keep each one exactly as drawn.
    items:
      - at: [37, 24]
        text: The angle is part of the mark. Keep it exactly as supplied.
        title: The tipped bucket
      - at: [44, 55]
        text: The curved cutout gives the solid shape its character. Never fill it in.
        title: The paint line
      - at: [75, 70]
        text: Small, but essential. Check that it stays visible at the size you use.
        title: The last drop
    props:
      image: assets/icon.svg
  - template: logos
    title: The right mark for the ground.
    lede: Choose a version, inspect its backgrounds, or take the whole kit.
    keys:
      - logo.primary
      - logo.mark
      - logo.markWhite
      - color.primary
      - color.dark
    items:
      - key: color.dark
        asset: assets/mark-black.svg
        caption: The black mark disappears on Night. Use white.
        verdict: dont
      - key: color.primary
        asset: assets/mark-white.svg
        caption: White disappears on Volt. Use the week's tile file.
        verdict: dont
    props:
      ask: false
      kit: true
      size: large
    columns: 3
  - id: clearspace
    template: diagram
    title: Leave a little room.
    body: Keep a quarter of the mark's height clear on every side, wherever the mark appears.
    keys: [logo.mark, logo.clearSpace]
    props:
      kind: clearspace
  - id: small
    template: diagram
    title: Small should still feel like us.
    body: See the standalone mark at actual size. The paint line and drop should remain distinct.
    keys: [logo.mark, logo.minSize]
    props:
      kind: minsize
  - template: dodont
    title: Keep the bucket itself.
    keys: [logo.always, logo.neverDo]
    props:
      layout: pairs
  - id: next
    template: pages
    title: Keep exploring.
    items:
      - link: /color
        text: This week's accent, and the neutrals that hold it.
        title: 02 / Color
      - link: /type
        text: Three faces and one scale.
        title: 03 / Type
      - link: /voice
        text: Habits, examples and copy to paste.
        title: 04 / Voice
      - link: /playground
        text: The pattern, spacing, corners, motion and charts, drawn.
        title: 05 / Playground
      - link: /resources
        text: Every file, and a way to ask for more.
        title: 06 / Resources
