tone.voice:
  type: text
  value: Plain, exact and a little dry. We say what a thing does, in the words its reader uses, and stop.
  usage: "Anything Artbucket says: the app, the docs, the site, commit messages."
tone.always:
  type: list
  value:
    - A headline says what the reader gets, in six words or fewer. The muted line under it finishes that thought with a concrete noun, never a second slogan.
    - Outcomes before features, in the reader's words; technical terms behind a For developers view.
    - Short sentences. Two sentences over one long one.
    - Name the thing, not its category.
    - Say what happens, not what is possible.
tone.avoid:
  type: list
  value:
    - Em dashes. Use a comma, a colon, " - " or two sentences.
    - Marketing words like seamless, powerful, effortless.
    - Exclamation marks.
tone.action:
  type: text
  label: An action
  value: Find the right asset.
  usage: Short, concrete and easy to act on.
  spec:
    max: 40
    copy: true
tone.empty:
  type: text
  label: An empty state
  value: No assets yet. Upload the first one.
  usage: State what is missing, then give the next step.
  spec:
    max: 80
    copy: true
tone.error:
  type: text
  label: An error
  value: That asset did not upload. Try again.
  usage: Name the problem without blaming the reader.
  spec:
    max: 100
    copy: true
