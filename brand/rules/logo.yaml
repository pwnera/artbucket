logo.primary:
  type: text
  label: App icon
  value: "The mark on a rounded tile in this week's accent: ink on Volt, Signal and Moss, white on Iris, Tide and Fuchsia."
  usage: The default. Favicons, avatars, the app's corner. The weekly release redraws the tile in the new accent; where a copy can't follow the week (GitHub, social profiles, app stores), use the Iris tile.
  assets: [assets/icon.svg]
logo.mark:
  type: text
  label: Mark in black
  value: "The mark alone in near black, #111111 as the file has it, not Ink: a tipped paint bucket, a paint line, one drop."
  usage: On light grounds and one-color print.
  assets: [assets/mark-black.svg]
logo.markWhite:
  type: text
  label: Mark in white
  value: The mark alone in white.
  usage: On Night, on the accents that take white, and on photographs dark enough to hold it.
  assets: [assets/mark-white.svg]
logo.always:
  type: list
  value:
    - "Always one color: the week's tile file, all black, or all white."
    - "Set the wordmark, Artbucket, in Funnel Display beside the mark, a quarter of the mark's height apart. There is no wordmark file yet: ask on Resources before setting one for print."
logo.neverDo:
  type: list
  value:
    - Recolor the mark, or give it a gradient.
    - Stretch it, rotate it or right the bucket.
    - Set it on a busy ground it can't stand out from.
logo.clearSpace:
  type: number
  label: Room around the mark
  value: 0.25
  usage: In these layouts, reserve at least one quarter of the mark's height on each side.
  spec:
    unit: x
logo.minSize:
  type: number
  label: Small, still clear
  value: 24
  usage: Use at least 24px for the standalone mark in these layouts. Check the drop at actual size.
  spec:
    unit: px
