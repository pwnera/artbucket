brand.description:
  type: text
  value: "Brand ops for brand, marketing and agency teams: one source of truth for your logos, colors and rules, and every change rolled out to your sites, portals and AI tools. Open source."
  usage: Where one sentence has to say what Artbucket is.
  spec:
    copy: true
brand.headline:
  type: text
  label: The headline
  value: Change your brand once.
  usage: The short introduction on a cover, website or presentation.
  spec:
    max: 40
    copy: true
brand.tagline:
  type: text
  value: Change your brand once. It's right everywhere.
  usage: The line under the name, on the site, the README and the cover.
  spec:
    copy: true
brand.intro:
  type: text
  label: The short introduction
  value: Artbucket keeps every logo, color and photo your team, agencies and AI tools use current and cleared.
  usage: When the headline needs one more sentence.
  spec:
    max: 120
    copy: true
brand.naming:
  type: list
  label: Our names
  value:
    - Artbucket, with a capital A, in prose and in the UI. Lowercase only in code, commands, URLs and the domain, artbucket.io. Never ArtBucket or Art Bucket.
    - BrandHub, one word, with a capital B and H. Never Brand Hub. On our own site, Hub means BrandHub.
    - In product copy, what people keep are brands, collections and assets. Never folders or files.
