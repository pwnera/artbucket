motion.feedback:
  type: number
  label: A quick response
  value: 180
  usage: Small feedback transitions, following the website's button timing.
  spec:
    unit: ms
motion.reveal:
  type: number
  label: A quiet entrance
  value: 320
  usage: Larger reveals, such as a section or a panel coming in. With reduced motion, nothing moves.
  spec:
    unit: ms
