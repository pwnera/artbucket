color.primary:
  type: color
  label: Violet
  value: "#6d4aff"
  usage: The mark's tile, primary buttons, focus rings. A fill, rarely text.
  spec:
    pair: color.background
    group: Signature
    tints: [80, 60, 40, 20]
    weight: 20
color.primaryInk:
  type: color
  label: Violet ink
  value: "#5b38f0"
  usage: Violet as text and icons on light grounds, where Violet itself is too light.
  spec:
    group: Primary
  contexts:
    dark-background:
      value: "#a592ff"
color.highlight:
  type: color
  label: Lime
  value: "#e1eea1"
  usage: A highlight behind a word or a badge, never a fill for large areas.
  spec:
    pair: color.ink
    group: Signature
    weight: 3
color.ink:
  type: color
  label: Ink
  value: "#20241f"
  usage: Text on light grounds.
  spec:
    pair: color.background
    group: Neutrals
    weight: 7
color.background:
  type: color
  label: Paper
  value: "#ffffff"
  usage: The page. Leave enough of it empty for the work to stand out.
  spec:
    pair: color.ink
    group: Neutrals
    weight: 50
color.panel:
  type: color
  label: Mist
  value: "#f4f4f7"
  usage: Panels, secondary buttons and muted grounds.
  spec:
    pair: color.ink
    group: Neutrals
    weight: 20
color.border:
  type: color
  label: Line
  value: "#eae8eb"
  usage: Hairlines and card borders.
  spec:
    group: Neutrals
color.dark:
  type: color
  label: Night
  value: "#141414"
  usage: The dark ground. Neutral grey, since tinted neutrals turn muddy near black.
  spec:
    pair: color.background
    group: Neutrals
