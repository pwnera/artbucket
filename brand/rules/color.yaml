color.primary:
  type: color
  label: Iris
  value: "#6b4dff"
  usage: "This week's accent, the only color the weekly release changes. A fill: eyebrow marks, highlights, the icon's tile, the halo around the primary button. Never text."
  spec:
    pair: color.onPrimary
    group: Signature
    tints: [80, 60, 40, 20]
    weight: 10
color.onPrimary:
  type: color
  label: On accent
  value: "#ffffff"
  usage: Text and the mark on this week's accent. Ink on Volt, Signal and Moss; white on Iris, Tide and Fuchsia.
  spec:
    pair: color.primary
    group: Signature
color.ink:
  type: color
  label: Ink
  value: "#16152a"
  usage: Text and primary buttons on Paper and Mist.
  spec:
    pair: color.background
    group: Neutrals
    weight: 10
  contexts:
    dark-background:
      value: "#f2f1f7"
color.muted:
  type: color
  label: Muted
