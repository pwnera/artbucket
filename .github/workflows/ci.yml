name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: artbucket
          POSTGRES_PASSWORD: artbucket
          POSTGRES_DB: artbucket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artbucket"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://artbucket:artbucket@localhost:5432/artbucket
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: artbucket
      S3_ACCESS_KEY_ID: artbucket
      S3_SECRET_ACCESS_KEY: artbucket
      S3_FORCE_PATH_STYLE: "true"
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-not-for-anything-real-0123456789

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrations apply cleanly
        run: pnpm db:migrate

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:dashes
      - run: pnpm test
      - run: pnpm build
