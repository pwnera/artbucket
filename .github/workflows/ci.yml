name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: artbucket
          POSTGRES_PASSWORD: artbucket
          POSTGRES_DB: artbucket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artbucket"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://artbucket:artbucket@localhost:5432/artbucket
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: artbucket
      S3_ACCESS_KEY_ID: artbucket
      S3_SECRET_ACCESS_KEY: artbucket
      S3_FORCE_PATH_STYLE: "true"
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-not-for-anything-real-0123456789

    steps:
      - uses: actions/checkout@v7
        with:
          # The base branch too: the migration checks below compare with it.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrations apply cleanly
        run: pnpm db:migrate

      # The migration path: any release upgrades to any later one by applying
      # drizzle/ in order (lib/db/migrate.ts). These keep that true.
      - name: Migrations match the schema
        run: |
          pnpm db:generate --name=unmigrated
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::src/lib/db/schema.ts has changes no migration makes. Run pnpm db:generate and commit it."
            git status --porcelain drizzle/
            exit 1
          fi

      - name: Released migrations are never edited
        if: github.event_name == 'pull_request'
        run: |
          edited=$(git diff --name-only --diff-filter=MDR "origin/${{ github.base_ref }}" -- 'drizzle/*.sql')
          if [ -n "$edited" ]; then
            echo "::error::A released migration changed: $edited. Add a new migration instead."
            exit 1
          fi

      - name: Upgrades from the base branch, with rows in it
        if: github.event_name == 'pull_request'
        env:
          UPGRADE_URL: postgres://artbucket:artbucket@localhost:5432/upgrade
        run: |
          psql "$DATABASE_URL" -c "create database upgrade"
          git worktree add ../base "origin/${{ github.base_ref }}"
          ln -s "$PWD/node_modules" ../base/node_modules
          (cd ../base && DATABASE_URL="$UPGRADE_URL" pnpm db:migrate)
          # The base's own fixture fits the base's schema; one without a fixture is tried empty.
          if [ -f ../base/scripts/upgrade-fixture.sql ]; then psql -v ON_ERROR_STOP=1 "$UPGRADE_URL" -f ../base/scripts/upgrade-fixture.sql; fi
          DATABASE_URL="$UPGRADE_URL" pnpm db:migrate
          # And this version's fixture fits this version's schema, for the next pull request.
          psql -v ON_ERROR_STOP=1 "postgres://artbucket:artbucket@localhost:5432/artbucket" -f scripts/upgrade-fixture.sql

      # v1 is a promise (docs: developers/stability): nothing a client of the
      # base branch relies on may change. pnpm test checks against this
      # branch's contract/; this checks against the base's, which a
      # re-freeze can't move.
      - name: The v1 contract holds against the base branch
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p ../base-contract
          if git show "origin/${{ github.base_ref }}:contract/api-v1.json" > ../base-contract/api-v1.json 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:contract/mcp-v1.json" > ../base-contract/mcp-v1.json
            pnpm contract:check ../base-contract
          fi

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:dashes
      - run: pnpm test
      - run: pnpm build

  # A pull request adds no dependency with a known vulnerability or a license the AGPL can't carry.
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: SSPL-1.0, BUSL-1.1, Elastic-2.0, CC-BY-NC-4.0
          comment-summary-in-pr: on-failure

  # The image a release publishes still builds (release.yml pushes it on a tag).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # And for arm64, on an arm64 runner, as release.yml builds it: an image that
  # only fails there would otherwise first fail on a release.
  image-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=app-arm64
          cache-to: type=gha,mode=max,scope=app-arm64

  # So does the CLI's (ghcr.io/pwnera/artbucket/cli), and it runs.
  cli-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: cli/Dockerfile
          load: true
          tags: artbucket-cli:ci
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli
      - run: docker run --rm artbucket-cli:ci --help
