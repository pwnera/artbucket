# Releases without bumping versions by hand. Each push to main updates one pull request,
# "chore: release x.y.z", that collects the Conventional Commits since the last release: the next
# version (a fix is a patch, a feat a minor, a ! a major, which v1 forbids: docs/developers/stability.mdx),
# CHANGELOG.md, and the version in package.json and cli/package.json. Merging it tags vx.y.z and
# publishes the GitHub release, then release.yml builds the images and the CLI.
#
# A tag made with the default token starts no other workflow, so release.yml is called from here.
# With a RELEASE_PLEASE_TOKEN secret (a fine-grained token with contents and pull requests: write),
# CI also runs on the release pull request and the tag's own push starts release.yml instead.
name: Release please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      own-token: ${{ steps.token.outputs.own }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: token
        env:
          OWN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: echo "own=$OWN" >> "$GITHUB_OUTPUT"

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true' && needs.release-please.outputs.own-token != 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
