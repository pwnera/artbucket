# Pull request hygiene, for the maintainer's pull requests and everyone else's:
# - area labels from the files touched (.github/labeler.yml);
# - every commit's subject is a Conventional Commit with no em dash (CONTRIBUTING.md, AGENTS.md),
#   since the changelog and the next version are made from them (release-please.yml); a subject
#   over 72 characters is a warning, since the changelog shows it whole;
# - a pull request from someone who can't write to the repository ticks the contributor terms box.
#
# pull_request_target, so a fork's pull request can be labeled: it runs the base branch's workflow
# and never checks out or runs the pull request's code. Titles, bodies and messages are read from
# the API into variables, never pasted into a script.
name: Pull request

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: false

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Conventional Commits
        run: |
          # Merges, reverts and bots' commits (Dependabot, the brand-as-code app) are not held to it.
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9./_-]+\))?!?: .+'
          bad=0
          while IFS=$'\t' read -r sha login subject; do
            case "$subject" in "Merge "*|"Revert \""*) continue ;; esac
            case "$login" in *"[bot]") continue ;; esac
            if ! grep -qE "$pattern" <<<"$subject"; then
              echo "::error::${sha::7} \"$subject\" is not a Conventional Commit (feat:, fix:, docs:, refactor:, chore:...)."
              bad=1
            elif grep -q $'\xe2\x80\x94' <<<"$subject"; then
              echo "::error::${sha::7} \"$subject\" has an em dash (AGENTS.md); use ' - ', a comma or a colon."
              bad=1
            elif [ "${#subject}" -gt 72 ]; then
              echo "::warning::${sha::7} \"$subject\" is ${#subject} characters; the changelog reads best under 72."
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" \
                     --jq '.[] | [.sha, (.author.login // ""), (.commit.message | split("\n")[0])] | @tsv')
          if [ "$bad" = 1 ]; then
            echo "Reword them (git rebase -i, then reword) and push again. The changelog is written from these subjects."
            exit 1
          fi

  terms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.type != 'Bot'
    env:
      GH_TOKEN: ${{ github.token }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Contributor terms
        run: |
          # Whoever can write to the repository is not asked. Not author_association: an
          # organization member whose membership is private shows there as a contributor.
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || true)
          case "$perm" in admin|maintain|write) echo "$AUTHOR can write here ($perm)."; exit 0 ;; esac
          if grep -qiE '\[x\] I agree to the \[contributor terms\]' <<<"$BODY"; then exit 0; fi
          echo "::error::Tick \"I agree to the contributor terms\" in the description (CONTRIBUTING.md#contributor-terms). Editing the description runs this again."
          exit 1
