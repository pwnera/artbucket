name: Feature request
description: Propose something artbucket should do.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Check [ROADMAP.md](https://github.com/pwnera/artbucket/blob/main/ROADMAP.md)
        first - several things are deferred on purpose, each with a stated
        trigger for adding them. If yours is one of those, say what changed.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today? Describe the situation, not the solution.
    validations: { required: true }

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations: { required: true }

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered instead
