# Dependencies allowed to run install scripts. Everything else is blocked.
allowBuilds:
  esbuild: true # drizzle-kit
  unrs-resolver: true # eslint resolver
  exifreader: false
  free-email-domains: false # its script downloads a fresher list at install; the one it ships is used

# Patched versions of transitive dependencies with advisories (Dependabot).
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
  source-map-js: ^1.2.2
